name: Validation Dashboard

# Runs the full validation dashboard on every push and PR. Reports
# health status, SOI calibration coverage, and the CBO/JCT distributional
# benchmark suite. Publishes both raw-CPS and augmented top-tail --json
# outputs as workflow artifacts so regressions are diffable across runs.
#
# Gate behavior (exit codes from scripts/run_validation_dashboard.py):
#   0 — everything nominal; CI job passes.
#   1 — a health component is degraded OR a benchmark is rated
#       needs_improvement; CI job FAILS so the PR cannot merge.
#   2 — calibration warning (a single bracket <60% AGI coverage); CI job
#       still passes. This is a data-quality signal, not a regression.
#
# A separate step runs scripts/run_loo.py — Tier 2 leave-one-out — with its own
# ceiling. That number is held out and is expected to be an order of magnitude
# worse than the by-construction Tier 2 figure; the ceiling catches regressions
# in the structural machinery, it is not an accuracy claim.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  dashboard:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Run validation dashboard (human-readable)
        run: |
          set +e
          python scripts/run_validation_dashboard.py
          exit_code=$?
          echo ""
          if [ $exit_code -eq 0 ]; then
            echo "Dashboard: all green."
          elif [ $exit_code -eq 2 ]; then
            echo "Dashboard: calibration warning (data-quality signal, not a regression)."
          else
            echo "Dashboard: FAIL — see dashboard output above."
            exit $exit_code
          fi

      # --- Gate the honest (out-of-sample) tier ----------------------------
      # The Generic tier is the only one that claims predictive skill, and it
      # was the only one with no numeric ceiling in CI. Thresholds are set from
      # the *current* battery (see docs/VALIDATION.md Tier 1) by a fixed rule,
      # never by whatever the model happens to score:
      #   --max-mean-error  = ceil(current mean x 1.25) rounded up to the
      #                       nearest 5. Headroom for one new hard case, not
      #                       for silent drift on the existing ones.
      #   --min-within-25pct = current count within 25%, minus one case.
      # Phase B (CBO Options battery) took the battery from 9 to 23 cases and
      # re-derived both: 60 -> 55 (mean 44.8% -> 43.4%) and 5 -> 11
      # (6-of-9 -> 12-of-23). Tightening as the battery grows is expected;
      # loosening requires saying why in the PR.
      # Phase E (provenance) re-derived both and neither moved, at 23 -> 22
      # cases: retiring the unsourced top_rate_45 target (a 118% miss) and
      # re-sourcing biden_capital_gains_39 to the Green Book line item (79% ->
      # 142%, against a smaller and correctly-defined target) very nearly
      # cancel, taking the mean 43.4% -> 42.9%. ceil(42.9 x 1.25) to the
      # nearest 5 is still 55; 12-of-22 within 25%, minus one, is still 11.
      # Phase D merged with Phase E gives the live battery: 25 cases, mean
      # 52.6%, 14 within 25%. The rule now points the two thresholds in
      # opposite directions and they are treated differently, on purpose:
      #   ceiling  ceil(52.6 x 1.25) -> 70, which would be LOOSENING a gate
      #            that passes. Left at 55; the rule above says loosening needs
      #            a reason in the PR, and there is none.
      #   floor    14 - 1 = 13, which is the tightening the rule anticipates as
      #            the battery grows. Raised 11 -> 13. Phase D reported this
      #            one "unchanged" and so left it a derivation behind.
      # Wave 1 of the modeling plan (PRs #85-#88: spend-out, AMT derived path,
      # pharma incidence, IIJA scored on its authorization schedule) took the
      # same 25 cases to mean 34.4%, 16 within 25%. Both thresholds tighten by
      # the rule, and tightening needs no reason:
      #   ceiling  ceil(34.4 x 1.25) = 43 -> nearest 5 up = 45. Lowered 55 -> 45.
      #   floor    16 - 1 = 15. Raised 13 -> 15.
      # Re-derive after every wave; Wave 2 (capital gains) is expected to move
      # the mean again.
      # Wave 2 (PRs #93-#95: estate size distribution, expenditure units,
      # capital gains base/elasticity/stock/death channel) took the same 25
      # cases to mean 31.3%, 18 within 25%. Both tighten by the rule again:
      #   ceiling  ceil(31.3 x 1.25) = 40 -> nearest 5 = 40. Lowered 45 -> 40.
      #   floor    18 - 1 = 17. Raised 15 -> 17.
      # The Wave 3 provenance pass (PR #100) promoted CBO Option 56 into the
      # battery: 26 cases, mean 31.0%, 19 within 25%.
      #   ceiling  ceil(31.0 x 1.25) = 39 -> nearest 5 = 40. Unchanged.
      #   floor    19 - 1 = 18. Raised 17 -> 18.
      # Wave 4 lane 2 (PR #108: the six Green Book carve-outs and a behavioural
      # response on the gains-at-death channel) took the same 26 cases to mean
      # 18.5%, 21 within 25%, and for the first time the meta-test in
      # tests/test_ci_workflow.py fired: a ceiling of 40 is more than twice the
      # live mean, so the gate had stopped meaning anything. Both tighten by the
      # rule, and tightening needs no reason:
      #   ceiling  ceil(18.5 x 1.25) = 24 -> nearest 5 = 25. Lowered 40 -> 25.
      #   floor    21 - 1 = 20. Raised 18 -> 20.
      # The other Wave 4 lanes that touch Tier 1 (PR #105, Option 56 24.0% ->
      # 13.1%; PR #107, biden_high_income_tax re-sourced 14.1% -> 12.0%) take the
      # merged battery to about 18.0% and leave within-25 at 21, which derives to
      # the same 25 / 20 -- so this PR is stacked on #108 and is not re-run per
      # lane. Re-derive again after the next wave.
      # Wave 5 (PRs #113, #114, #116: the payroll base CBO names, the corporate
      # base the IRS publishes, a projected realizations base) took the same 26
      # cases to mean 15.9%, 22 within 25%. Two of the three lanes were
      # pre-registered regressions on their own rows and the tier still fell,
      # because the payroll pair went 54-56% -> 7.5-8.1%. Both thresholds
      # tighten by the rule, and tightening needs no reason:
      #   ceiling  ceil(15.9 x 1.25) = 20 -> nearest 5 = 20. Lowered 25 -> 20.
      #   floor    22 - 1 = 21. Raised 20 -> 21.
      # Wave 7 (PRs #126-#132) left the same 26 cases at mean 15.0%, 22 within
      # 25%, and the rule re-derived the gate to itself: 20 / 21, unchanged.
      # Waves A and B of planning/HIGH_STAKES_ACCURACY.md (PRs #140-#146) took
      # the same 26 cases to mean 14.7%, 23 within 25%. H2 raised the mean
      # 15.0% -> 15.6% (six registered regressions on the generic path) and H2b
      # took it to 14.7%, below where H2 found it; the pair is what the rule
      # reads, not either branch. Only the floor moves, and it tightens:
      #   ceiling  ceil(14.7 x 1.25) = 19 -> nearest 5 = 20. Unchanged.
      #   floor    23 - 1 = 22. Raised 21 -> 22.
      # Wave C (PRs #148-#151) took the same 26 cases to mean 14.5%, 22 within
      # 25%. One lane moved Tier 1 at all -- PR #151's decedent headcount, which
      # took cbo_opt51_gains_at_death 20.3% -> 35.5% as a registered regression
      # while taking biden_capital_gains_39 32.8% -> 27.0% and the FY2022
      # Treasury row 18.4% -> 1.8%. The tier mean fell and the within-25 count
      # fell with it, so for the first time the rule points the two thresholds in
      # opposite directions since Phase D, and "downward only" decides it:
      #   ceiling  ceil(14.5 x 1.25) = 19 -> nearest 5 = 20. Unchanged.
      #   floor    22 - 1 = 21, which would LOOSEN a gate that passes. LEFT AT
      #            22. A floor that follows the count down is not a floor: it
      #            would ratchet open on exactly the regression it exists to
      #            catch. The live count is 22, so the gate is met with no slack,
      #            which is the correct state after a wave that spent a case.
      # Re-derive again after the next wave.
      #
      # Lane R2 (ROUTE_TO_8_5.md section 1) is the first pass to make the
      # battery SMALLER, and that is a case the "downward only" rule above does
      # not cover, so it is spelled out. Four rows whose targets are in no
      # publication were withdrawn (warren_ultramillionaire_surtax_3pp,
      # medicare_surcharge_2pp, illustrative_top_rate_5pp,
      # illustrative_500k_2pp) and one moved onto CBO publication 58164's own
      # option. The tier reads 22 cases, mean 11.3%, 18 within 15% and 19
      # within 25%:
      #   ceiling  ceil(11.3 x 1.25) = 15 -> nearest 5 = 15. Lowered 20 -> 15.
      #   floor    the live count is 19, so 22 is now ABOVE what the battery
      #            can meet and the gate cannot pass at all. Lowered 22 -> 19.
      # That is a smaller NUMBER and a tighter STANDARD: the count fell because
      # the denominator fell, and the share within 25% rose 22/26 = 84.6% ->
      # 19/22 = 86.4%. Three of the four withdrawn rows were themselves inside
      # 25%, so the drop is not a regression being papered over -- no surviving
      # row moved by a cent, which the lane's outturn records row by row. The
      # move is also not discretionary: test_no_gate_is_looser_than_the_
      # workflow_rule_derives in tests/test_ci_workflow.py already asserts
      # min_within <= the live within-25 count, so a floor of 22 is a test
      # failure rather than a strict gate. Re-derive again after R3, which is
      # the lane that grows the battery back.
      - name: Cold-holdout gate (out-of-sample tier)
        run: |
          python scripts/cold_holdout.py --max-mean-error 15 --min-within-25pct 19

      # --- Per-class floor (HIGH_STAKES_ACCURACY.md section 3, rule 4) -------
      # The pooled gate above cannot see one policy class regressing while the
      # others carry the mean -- which is what happened to
      # medicare_surcharge_2pp in Wave 7 (1.5% -> 31.8% while the tier fell)
      # and again to warren_ultramillionaire_surtax_3pp in Wave B. So each of
      # the eight classes the plan reports (section 2) carries its own ceiling.
      #
      # Classes are derived from each case's own CBOScore record in
      # scripts/cold_holdout.py -- policy_type, plus agi_inclusive_base for the
      # income-tax split and cbo_options.runnable_score_ids() for the spending
      # split -- never from a hand-kept list of policy ids, so a row registered
      # tomorrow is classified the moment it is registered. The gate fails if a
      # class the battery contains is given no ceiling, so a ninth class cannot
      # arrive un-gated.
      #
      # Thresholds use the pooled rule's ceil(value x 1.25) and drop its
      # round-up-to-5, which exists to give the pooled mean headroom for one new
      # hard case; a class of one or two rows does not need five points of it.
      # Post-Wave-C values (26 cases, the run above). Exactly one class moved in
      # Wave C -- capital gains, 20.5% -> 18.7%, when PR #151 replaced a headcount
      # rate that was a dollar ratio with the module's own mortality-weighted one
      # -- so exactly one ceiling is re-derived, and it tightens:
      #   AGI-inclusive surtax    6  17.6% -> 22    capital gains   4  18.7% -> 24
      #   ordinary rate change    4  14.8% -> 19    corporate       1  44.5% -> 56
      #   enacted-law spending    3  13.4% -> 17    discretionary   5   4.6% ->  6
      #   payroll                 2   7.8% -> 10    tax expenditure 1  13.1% -> 17
      # Capital gains: ceil(18.7 x 1.25) = 24, lowered 26 -> 24. The other seven
      # re-derive to themselves. Note that the class mean fell while the class's
      # WORST row got 15 points worse (cbo_opt51 20.3% -> 35.5%, registered), so
      # this ceiling is tightening around a wider spread, not a narrower one --
      # which is the case the per-class gate exists for and the pooled one cannot
      # see. Re-derive with the pooled gate, after every wave, downward only.
      #
      # Owner decision (3) (iija_2021_discretionary.v3, scored on the FY2022-2031
      # decade CBO's own estimate covers) took that row 18.2% -> 0.3% and its
      # class, enacted-law spending, 13.4% -> 7.4% (12.2 / 0.3 / 9.8). Exactly
      # one ceiling re-derives and it tightens:
      #   enacted_law_spending  ceil(7.4 x 1.25) = 10, lowered 17 -> 10.
      # This one is not discretionary. Both meta-tests in
      # tests/test_ci_workflow.py are one-sided invariants -- a ceiling may
      # never be looser than ceil(mean x 1.25), nor more than ~2x the live mean
      # -- and 17 fails both at a class mean of 7.4%.
      # The pooled pair is untouched and neither derivation moves. The tier
      # reads 26 cases, mean 13.8%, 17 within 15% and 22 within 25%:
      #   ceiling  ceil(13.8 x 1.25) = 18 -> nearest 5 = 20. Unchanged.
      #   floor    22 - 1 = 21, which would LOOSEN. LEFT AT 22.
      # Worth recording why the floor did not move on a row that improved by 18
      # points: iija was already INSIDE 25% at 18.2%, so the count it moves is
      # within-15, 16 -> 17, a figure no gate reads. The pooled floor is met at
      # 22 with no slack, exactly as Wave C left it.
      #
      # Lane R2's withdrawals move two of the eight and both tighten. The
      # AGI-inclusive surtax class loses four of its six rows -- three of the
      # four withdrawn targets sit in it -- and what is left is the two CBO
      # Option 46 rows, the two with a published option and a transcribed
      # base: the class mean goes 17.6% -> 5.15%. The ordinary rate-change
      # class keeps all four rows and one of them moves onto its document,
      # 24.5% -> 10.5%, taking the class 14.8% -> 11.32%.
      #   agi_inclusive_surtax  ceil(5.15 x 1.25) = 7, lowered 22 -> 7.
      #   ordinary_rate_change  ceil(11.32 x 1.25) = 15, lowered 19 -> 15.
      # Neither is discretionary: at a class mean of 5.15% a ceiling of 22
      # fails both one-sided invariants in tests/test_ci_workflow.py, and 19
      # fails the first of them at 11.32%. The other six re-derive to
      # themselves. A class of TWO is a thin thing to gate, and the honest
      # reading is that this class shrank rather than improved -- R3 is the
      # lane that puts rows back into it.
      - name: Cold-holdout per-class floor (out-of-sample tier)
        run: |
          python scripts/cold_holdout.py --max-class-mean-error \
            agi_inclusive_surtax=7 ordinary_rate_change=15 \
            capital_gains=24 corporate=56 \
            enacted_law_spending=10 discretionary_spending=6 \
            payroll=10 tax_expenditure=16

      # Tier 2 (leave-one-out). Holds out one calibrated benchmark at a time and
      # asks whether the module's structural machinery — calibrated on the others
      # — can rebuild it. Kept as its own step and its own ceiling: this is a
      # held-out number and must never be conflated with the by-construction
      # Tier 2 figure (~5%) or with the Tier 1 out-of-sample battery. Ceiling is
      # the observed aggregate mean (~59%) x 1.25, rounded to the nearest 5.
      - name: Run leave-one-out cross-validation (Tier 2 LOO)
        run: |
          python scripts/run_loo.py --donor-matrix --max-mean-error 75

      - name: Leave-one-out JSON artifact
        if: always()
        run: |
          python scripts/run_loo.py --json --donor-matrix > validation-loo.json || true

      - name: Run validation dashboard (JSON)
        if: always()
        run: |
          python scripts/run_validation_dashboard.py --json > validation-dashboard.json || true

      - name: Run validation dashboard (augmented JSON)
        if: always()
        run: |
          python scripts/run_validation_dashboard.py --augment-top-tail --json > validation-dashboard-augmented.json || true

      - name: Upload dashboard artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: validation-dashboard
          path: |
            validation-dashboard.json
            validation-dashboard-augmented.json
            validation-loo.json
          retention-days: 30
