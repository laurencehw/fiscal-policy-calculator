name: Nightly Bill Tracker Update

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# Queue a manual dispatch behind the scheduled run (and vice versa) instead of
# letting two jobs generate bills.db and race on the same push. Do not cancel
# an in-flight run: it has already spent congress.gov / Anthropic quota.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-bills:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bill tracker update
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update_bills.py --verbose --cbo-fallback-file bill_tracker/cbo_manual_scores.json

      - name: Refresh the static export the new site reads
        env:
          ANTHROPIC_API_KEY: ""
        run: python scripts/export_static.py

      - name: Commit updated bills.db and site_data if changed
        env:
          NIGHTLY_ARTIFACT_DIR: ${{ runner.temp }}/nightly-data
        run: bash .github/scripts/commit-and-push-nightly-data.sh

      - name: Keep generated data if the push never landed
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: nightly-bill-tracker-${{ github.run_id }}
          path: ${{ runner.temp }}/nightly-data
          if-no-files-found: ignore
