# The engine-only API, deployed as a Vercel Python function (tools plan FPC-4).
#
# Vercel project settings: Root Directory "engine", framework preset FastAPI.
# The build step copies api.py and fiscal_model/ in from the repository root,
# so the function carries the engine and nothing the Streamlit app needs.
[project]
name = "fiscal-engine"
version = "1.0.0"
requires-python = ">=3.12,<3.14"
# The scoring engine's own needs. No streamlit, plotly, matplotlib or pyarrow:
# tests/test_engine_bundle.py imports the API with those blocked.
dependencies = [
    "numpy>=1.24.0,<2.5",
    "pyyaml>=6.0,<7.0",
    "pandas>=2.0.0,<3.0",
    "scipy>=1.10.0,<2.0",
    "pydantic>=2.0.0,<3.0",
    "fastapi>=0.109.0,<1.0",
    "anthropic>=0.49.0,<1.0",
    "requests>=2.31.0,<3.0",
    "beautifulsoup4>=4.12.0,<5.0",
    "pdfplumber>=0.11.0,<1.0",
]

[tool.vercel.scripts]
build = "python build.py"
